<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessy — a cute chess game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header class="top">
            <h1 class="logo">&#9823; Chessy <span class="heart">&#10084;</span></h1>
            <p class="tagline">a tiny, cute chess game</p>
        </header>

        <main class="layout">
            <section class="board-wrap">
                <div id="board" class="board"></div>
                <div id="banner" class="banner hidden"></div>
            </section>

            <aside class="panel">
                <div class="settings-panels">
                    <div>
                        <h3>Settings</h3>
                        <label for="theme-select">Board Theme</label>
                        <select id="theme-select">
                            <option value="default">Default (Classic)</option>
                            <option value="dark">Dark Mode</option>
                            <option value="pastel">Pastel</option>
                            <option value="high-contrast">High Contrast</option>
                            <option value="wood">Wood</option>
                            <option value="neon">Neon</option>
                        </select>
                    </div>

                    <div>
                        <label for="piece-style-select">Piece Style</label>
                        <select id="piece-style-select">
                            <option value="default">Default</option>
                            <option value="emoji">Emoji</option>
                        </select>
                    </div>

                    <div>
                        <button id="hint" class="btn btn-hint">💡 Hint</button>
                        <button id="new-game" class="btn btn-primary">New Game</button>
                        <button id="puzzle-mode" class="btn btn-primary">Puzzle Mode</button>
                    </div>

                    <div class="status-bar">
                        <span id="status">Your turn</span>
                        <span>Rating: <span id="rating">1200</span></span>
                        <span>Games: <span id="games-played">0</span></span>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="js/chess.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
