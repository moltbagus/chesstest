<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessy — a cute chess game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header class="top">
            <h1 class="logo">&#9823; Chessy <span class="heart">&#10084;</span></h1>
            <p class="tagline">a tiny, cute chess game</p>
        </header>

        <main class="layout">
            <section class="board-wrap">
                <div id="board" class="board"></div>
                <div id="banner" class="banner hidden"></div>
            </section>

            <aside class="panel">
                <div class="settings-panels">
                    <div>
                        <h3>Settings</h3>
                        <label for="theme-select">Board Theme</label>
                        <select id="theme-select">
                            <option value="default">Default (Classic)</option>
                            <option value="dark">Dark Mode</option>
                            <option value="pastel">Pastel</option>
                            <option value="high-contrast">High Contrast</option>
                            <option value="wood">Wood</option>
                            <option value="neon">Neon</option>
                        </select>
                    </div>

                    <div>
                        <label for="piece-style-select">Piece Style</label>
                        <select id="piece-style-select">
                            <option value="default">Default</option>
                            <option value="emoji">Emoji</option>
                            <option value="google">Google</option>
                        </select>
                    </div>

                    <div>
                        <label for="ai-difficulty">AI Difficulty</label>
                        <select id="ai-difficulty">
                            <option value="1">Easy</option>
                            <option value="2">Medium</option>
                            <option value="3" selected>Hard</option>
                        </select>
                    </div>

                    <div>
                        <label>
                            <input type="checkbox" id="sound-toggle" checked> Sound
                        </label>
                    </div>

                    <div>
                        <button id="hint" class="btn btn-hint">💡 Hint</button>
                        <button id="undo" class="btn btn-secondary">↩ Undo</button>
                        <button id="puzzle-mode" class="btn btn-primary">🧩 Puzzles</button>
                        <button id="new-game" class="btn btn-primary">New Game</button>
                    </div>

                    <div class="status-bar">
                        <span id="status">Your turn</span>
                        <span>⭐ Level <span id="level">1</span></span>
                        <span>Rating: <span id="rating">1200</span></span>
                        <span>Games: <span id="games-played">0</span></span>
                    </div>
                    <div class="xp-container"><div id="xp-bar" class="xp-bar"></div></div>
                </div>
                <section class="leaderboard-card" aria-labelledby="leaderboard-title">
                    <div class="section-heading">
                        <h3 id="leaderboard-title">🏆 Leaderboard</h3>
                        <button id="change-name" class="link-btn" type="button">Change name</button>
                    </div>
                    <div id="leaderboard" class="leaderboard" aria-live="polite"></div>
                    <p class="leaderboard-note">This leaderboard is saved on this device.</p>
                </section>
            </aside>
        </main>
    </div>

    <div id="name-modal" class="name-modal hidden" role="dialog" aria-modal="true" aria-labelledby="name-title">
        <div class="name-dialog">
            <div class="name-mascot">♞</div>
            <h2 id="name-title">Welcome to Chessy!</h2>
            <p>What should we call you on the leaderboard?</p>
            <form id="name-form">
                <label for="player-name">Your name</label>
                <input id="player-name" name="player-name" type="text" maxlength="100" autocomplete="nickname" required>
                <button class="btn btn-primary" type="submit">Let's play! →</button>
            </form>
        </div>
    </div>

    <script src="js/chess.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
